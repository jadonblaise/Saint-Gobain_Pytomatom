# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/

# Serving vue.js-frontend and django-backend for the pytomatom project on ODESVLPOR001AP.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log debug;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
# include /usr/share/nginx/modules/*.conf;

events {
    # We're in 2016 now, an average wall-mart toaster can process more requests than the default value of 1024.
    # The default should be modern. We won't touch.
    # worker_connections 16384;
}
# worker_rlimit_nofile = worker_connections * 2
# The hard limit can be seen with `ulimit -Hn`, the soft limit with `ulimit
# -Sn`. (262144 and 1024 on this system repsectively), also check: `cat /proc/sys/fs/file-max` (781924 here)
# worker_rlimit_nofile 32768;


http {

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;
    error_log /var/log/nginx/error.log  warn;

    # disable caching for test debugging
    # proxy_cache_bypass 1;
    # proxy_no_cache 1;

    # we are not using sendfile
    # sendfile            on;
    # tcp_nopush          on;
    # tcp_nodelay         on;

    # just leaving these 4 default as is..
    keepalive_timeout   65;
    types_hash_max_size 2048;
    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    # include /etc/nginx/conf.d/*.conf;


    # -------------------------------------------------------------------------
    # Server Configuration

    server {

        listen       443 ssl http2 default_server;
        listen       80 default_server;

        listen       [::]:443 ssl http2 default_server;
        listen       [::]:80 default_server;

        server_name  _;

        # ! No ssl certs for testing
        # Settings for a TLS enabled server.
        ssl_certificate "/app/certificates/ODESVLPOR001AP.zb.if.atcsg.net.cer";
        ssl_certificate_key "/app/certificates/pytomatom.key";
        ssl_password_file "/app/certificates/certificate.password";
        ssl_session_cache shared:SSL:1m;
        ssl_session_timeout  10m;
        ssl_ciphers PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        # root         /usr/share/nginx/html;

        # Load configuration files for the default server block.
        # include /etc/nginx/default.d/*.conf;

        location /assets {
            # Serve static files from the specified directory
            #Remove "/assets" from the URI before serving static files
            rewrite ^/assets(.*)$ $1 break;
            root        /app/src/staticfiles;
            index       index.html;
        }

        location / {
            # Proxy everything else to localhost:8000
            try_files   $uri $uri/ @proxy;
        }

        location @proxy {
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            proxy_pass http://localhost:8000;

            proxy_connect_timeout 300s; # time to open a connection to the proxy before we give up, in seconds
            proxy_send_timeout 300s; # timeout for transmitting a request to the proxied server
            proxy_read_timeout 300s; # timeout for reading a response from the proxied server - did it send back anything before this has expired
            send_timeout 300s; # timeout for sending a response to the requesting client - note this isn't proxy_send_timeout, but the time between two successive write operations to the requesting client (ie. browser)
        }

        # error pages are handled by the vue.js-frontend or django
        # error_page 404 /404.html;
        #    location = /40x.html {
        # }
        # error_page 500 502 503 504 /50x.html;
        #    location = /50x.html {
        # }

    }
}
