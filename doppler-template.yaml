projects:
  - name: 'pytomatom' # Name may contain lowercase letters, spaces, numbers, hyphens, and underscores
    description: 'pytomatom description'

    # probably all dotenv examples should be here.. and setup develop and prod envs

    # List of totally customizable environments, e.g Test, Stage, QA, CI-CD
    environments:
      - name: 'Development' # Name may contain letters, spaces, numbers, hyphens, and underscores
        slug: 'dev' # Slug may contain letters, numbers, hyphens, and underscores
        configs:
          - slug: 'dev' # First slug *must* match environment slug name
          - slug: 'dev_mrkf'
      - name: 'Production'
        slug: 'production'
        configs:
          - slug: 'production'
      - name: 'Staging'
        slug: 'staging'
        configs:
          - slug: 'staging'
      - name: 'Test'
        slug: 'test'
        configs:
          - slug: 'test'
    # Define secrets for each environment
    secrets:
      dev:
        PROJECT_FQDN: 'http://localhost:8000'
        PROJECT_FRONTEND_FQDN: 'http://localhost:3000'
        DJANGO_SETTINGS_MODULE: 'config.settings.develop'
        DJANGO_ALLOW_ASYNC_UNSAFE: 'true'
        DJANGO_SECRET_KEY: '{{ secret_key }}'
        DJANGO_ADMIN_URL: 'admin/'
        # --- POSTGRES ----------------------------------------------------------------
        # postgres settings might be specific to a developer if you're using your own postgres instance
        # doppler configure set config=dev_aro
        # these settings get injected into the postgres container, before you build
        # if you change them, you need to rebuild the postgres container (and remove the old volume)
        # podman volume rm pytomatom_postgres_data
        POSTGRES_USER: 'pytomatomdevuser'
        POSTGRES_PASSWORD: 'develop'
        POSTGRES_DB: 'pytomatomdevdb'
        POSTGRES_OPTIONS: '?sslmode=prefer'
        # this is used by django only, to change the port of the postgres container, modify it's compose file
        POSTGRES_PORT: '5432'
        # container host when also running in the container network
        # POSTGRES_HOST=postgres
        # container host on windows/mac
        # POSTGRES_HOST=host.containers.internal
        # container host on linux
        # POSTGRES_HOST=localhost
        POSTGRES_HOST: 'localhost'
        VITE_APP_MODE: 'django'
        DJANGO_SECURE_SSL_REDIRECT: 'false'
        DJANGO_ALLOWED_HOSTS: '*'
        DJANGO_CORS_ALLOWED_ORIGINS: '*'
        DJANGO_CORS_ALLOW_ALL_ORIGINS: 'true'
        SHAREPOINT_TENANT_ID: ''
        SHAREPOINT_CLIENT_SECRET: ''
        SHAREPOINT_CLIENT_ID: ''
        # -----------------------------------------------------------------------------
      test:
        DJANGO_SETTINGS_MODULE: 'config.settings.test'
      staging:
        PROJECT_FQDN: ''
        PROJECT_FRONTEND_FQDN: ''
        DJANGO_SETTINGS_MODULE: 'config.settings.production'
        DJANGO_ALLOW_ASYNC_UNSAFE: 'false'
        DJANGO_SECRET_KEY: '{{ secret_key }}'
        DJANGO_ADMIN_URL: 'admin/'
        POSTGRES_USER: 'pytomatomstaginguser'
        POSTGRES_PASSWORD: 'staging'
        POSTGRES_DB: 'pytomatomstagingdb'
        POSTGRES_OPTIONS: '?sslmode=prefer'
        POSTGRES_PORT: '5432'
        POSTGRES_HOST: 'localhost'
        VITE_APP_MODE: 'django'
        # ssl is terminated by nginx
        DJANGO_SECURE_SSL_REDIRECT: 'false'
        DJANGO_ALLOWED_HOSTS: ''
        DJANGO_CORS_ALLOWED_ORIGINS: ''
        DJANGO_CORS_ALLOW_ALL_ORIGINS: 'false'
        SHAREPOINT_TENANT_ID: ''
        SHAREPOINT_CLIENT_SECRET: ''
        SHAREPOINT_CLIENT_ID: ''
      production:
        DEPLOYMENT_TOKEN: ''
        PROJECT_FQDN: ''
        PROJECT_FRONTEND_FQDN: ''
        DJANGO_SETTINGS_MODULE: 'config.settings.production'
        DJANGO_ALLOW_ASYNC_UNSAFE: 'false'
        DJANGO_SECRET_KEY: ''
        DJANGO_ADMIN_URL: ''
        POSTGRES_USER: 'pytomatomproduser'
        POSTGRES_PASSWORD: ''
        POSTGRES_DB: 'pytomatomproddb'
        POSTGRES_OPTIONS: '?sslmode=prefer'
        POSTGRES_PORT: '5432'
        POSTGRES_HOST: 'localhost'
        VITE_APP_MODE: 'django'
        # ssl is terminated by nginx
        DJANGO_SECURE_SSL_REDIRECT: 'false'
        DJANGO_ALLOWED_HOSTS: ''
        DJANGO_CORS_ALLOWED_ORIGINS: ''
        DJANGO_CORS_ALLOW_ALL_ORIGINS: 'false'
        SHAREPOINT_TENANT_ID: ''
        SHAREPOINT_CLIENT_SECRET: ''
        SHAREPOINT_CLIENT_ID: ''
